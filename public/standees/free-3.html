(function(){
  var stage=document.getElementById('stage'),cv=document.getElementById('cv');
  var ctx=document.createElement('canvas').getContext('2d');
  function scale(){cv.style.transform='scale('+(stage.clientWidth/1024)+')'}
  function fam(el){return getComputedStyle(el).fontFamily}
  function meas(text,fs,w,f){ctx.font=w+' '+fs+'px '+f;return ctx.measureText(text)}
  function ref(el){
    if(el._ref)return el._ref;
    var b=el.dataset.b.split(',').map(Number),w=el.dataset.w,f=fam(el),t=el.dataset.keep?el.dataset.def:el.dataset.def.toUpperCase();
    var m=meas(t,100,w,f),fs=100*(b[3]-b[2]+1)/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
    m=meas(t,fs,w,f);
    var nat=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,bw=b[1]-b[0]+1;
    return el._ref={fs:fs,ls:t.length>1?(bw-nat)/(t.length-1):0,x0:b[0],cx:(b[0]+b[1]+1)/2,y1:b[3],maxW:bw*(el.dataset.align==='left'?1.3:1.15)};
  }
  function place(el,text){
    var r=ref(el),w=el.dataset.w,f=fam(el),fs=r.fs,ls=r.ls,n=text.length,m=meas(text,fs,w,f);
    var width=m.actualBoundingBoxLeft+m.actualBoundingBoxRight+ls*(n-1);
    if(width>r.maxW){var k=r.maxW/width;fs*=k;ls*=k;m=meas(text,fs,w,f);width=r.maxW}
    var left=el.dataset.align==='left'?r.x0:r.cx-width/2;
    el.style.fontSize=fs+'px';el.style.letterSpacing=ls+'px';
    el.style.left=(left+m.actualBoundingBoxLeft)+'px';
    el.style.top=((r.y1+1-m.actualBoundingBoxDescent)-m.fontBoundingBoxAscent)+'px';
    el.style.visibility='visible';
  }
  function drawQR(url,color){
    var q=qrcode(0,'M');q.addData(String(url||' '));q.make();
    var n=q.getModuleCount(),d='';
    for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(q.isDark(y,x))d+='M'+x+' '+y+'h1v1h-1z';
    var svg=document.getElementById('qr'),p=document.getElementById('qrp');
    svg.setAttribute('viewBox','0 0 '+n+' '+n);svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    p.setAttribute('d',d);p.setAttribute('fill',color);
  }
  function logoSrc(v){
    if(!v)return DEFAULT_LOGO;
    if(/^\s*<svg/i.test(v))return 'data:image/svg+xml;utf8,'+encodeURIComponent(v);
    return String(v);
  }
  function render(over){
    var c=Object.assign({},CONFIG,over||{});
    document.querySelectorAll('.t').forEach(function(el){
      var v=c[el.dataset.key];if(v==null)v=el.dataset.def;
      v=String(v);if(!el.dataset.keep)v=v.toUpperCase();el.textContent=v;

    drawQR(c.menuUrl,c.qrColor);
    document.getElementById('logo').src=logoSrc(c.logo);
  }
  var qs=new URLSearchParams(location.search),over={};
  Object.keys(CONFIG).forEach(function(k){if(qs.has(k))over[k]=qs.get(k)});
  window.renderStandee=function(o){Object.assign(over,o||{});render(over)};

  var F=document.fonts;

  function go(){render(over)}
  ready.then(function(){return F.ready}).then(go,go);
  setTimeout(go,2500);
})();
